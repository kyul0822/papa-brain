<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>아버님 두뇌 활력</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background: #f0f7f4; padding: 15px; margin: 0; }
        .game-box { background: white; padding: 25px; border-radius: 20px; margin-top: 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); border: 2px solid #d1e7dd; }
        .choice-btn { 
            font-size: 20px; padding: 16px; margin: 6px 0; width: 100%; 
            border-radius: 12px; border: 2px solid #2E7D32; background: white; color: #2E7D32; 
            cursor: pointer; font-weight: bold;
        }
        .none-btn { font-size: 18px; padding: 12px; margin-top: 15px; width: 100%; border-radius: 12px; border: 1px solid #78909C; background: #f1f3f4; color: #455A64; cursor: pointer; }
        .main-btn { font-size: 24px; padding: 20px; width: 100%; border-radius: 15px; border: none; background: #2E7D32; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #1b4d21; }
        img { width: 100%; border-radius: 15px; margin-top: 10px; max-height: 38vh; object-fit: contain; background: #eee; }
        .timer-badge { background: #ffeb3b; padding: 5px 15px; border-radius: 10px; color: #d32f2f; font-weight: bold; font-size: 1.2em; }
        .feedback-mark { font-size: 4em; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

    <h2 style="color: #1b4d21;">🧠 맞춤형 인지 훈련</h2>
    <div id="game-area">
        <div class="game-box">
            <p style="font-size: 1.4em; line-height: 1.6;">아버님께 딱 맞는 사진들로만<br>훈련 세트가 구성됩니다.</p>
            <button class="main-btn" onclick="initGame()">훈련 시작하기</button>
        </div>
    </div>

    <script>
        let currentRound = 1;
        let score = 0;
        let history = [];
        let sessionList = [];

        const masterBank = [
            { name: "호랑이", ids: [50, 51, 52] }, { name: "사자", ids: [88, 89, 90] },
            { name: "코끼리", ids: [120, 121, 122] }, { name: "기린", ids: [210, 211, 212] },
            { name: "판다", ids: [305, 306, 307] }, { name: "토끼", ids: [45, 46, 47] },
            { name: "강아지", ids: [10, 11, 12] }, { name: "고양이", ids: [20, 21, 22] },
            { name: "다람쥐", ids: [610, 611, 612] }, { name: "독수리", ids: [75, 76, 77] },
            { name: "장미", ids: [900, 901, 902] }, { name: "해바라기", ids: [810, 811, 812] },
            { name: "소나무", ids: [1200, 1201, 1202] }, { name: "벚꽃", ids: [1100, 1101, 1102] },
            { name: "민들레", ids: [1005, 1006, 1007] }, { name: "강아지풀", ids: [1500, 1501, 1502], avoid: "강아지" },
            { name: "토끼풀", ids: [1600, 1601, 1602], avoid: "토끼" }, { name: "무궁화", ids: [1800, 1801, 1802] },
            { name: "연꽃", ids: [1900, 1901, 1902] }, { name: "은행나무", ids: [1300, 1301, 1302] },
            { name: "낙타", ids: [1400, 1401, 1402] }, { name: "펭귄", ids: [1550, 1551, 1552] },
            { name: "얼룩말", ids: [1650, 1651, 1652] }, { name: "수달", ids: [1750, 1751, 1752] },
            { name: "물개", ids: [1850, 1851, 1852] }, { name: "나비", ids: [1950, 1951, 1952] }
        ];

        function initGame() {
            currentRound = 1; score = 0; history = [];
            
            let usedNames = JSON.parse(localStorage.getItem('usedQuizNames') || "[]");
            let badImages = JSON.parse(localStorage.getItem('badImages') || "{}"); // { "이미지URL": 횟수 }

            // 1. 최근 사용된 이름 제외 + 불량 사진 제외 로직
            let availableBank = masterBank.map(item => {
                // 각 항목의 ids 중 불량 목록에 없는 것만 필터링
                let safeIds = item.ids.filter(id => {
                    let url = `https://loremflickr.com/800/600/${encodeURIComponent(item.name)}?lock=${id}`;
                    return (badImages[url] || 0) < 2;
                });
                return { ...item, ids: safeIds };
            }).filter(item => item.ids.length > 0 && !usedNames.includes(item.name));

            if (availableBank.length < 10) {
                usedNames = [];
                localStorage.setItem('usedQuizNames', JSON.stringify([]));
                // 문제가 부족하면 다시 전체에서 검색
                availableBank = masterBank.filter(item => {
                    let safeIds = item.ids.filter(id => {
                        let url = `https://loremflickr.com/800/600/${encodeURIComponent(item.name)}?lock=${id}`;
                        return (badImages[url] || 0) < 2;
                    });
                    return safeIds.length > 0;
                });
            }

            sessionList = availableBank.sort(() => 0.5 - Math.random()).slice(0, 10);

            let newUsedNames = [...usedNames, ...sessionList.map(item => item.name)];
            if (newUsedNames.length > 20) newUsedNames = newUsedNames.slice(newUsedNames.length - 20);
            localStorage.setItem('usedQuizNames', JSON.stringify(newUsedNames));

            nextRound();
        }

        function nextRound() {
            if (currentRound > 10) { showResult(); return; }
            let target = sessionList[currentRound - 1];
            // 필터링된 안전한 ID 중 랜덤 선택
            let selectedId = target.ids[Math.floor(Math.random() * target.ids.length)];
            let imgUrl = `https://loremflickr.com/800/600/${encodeURIComponent(target.name)}?lock=${selectedId}`;
            
            let distractors = masterBank
                .filter(item => item.name !== target.name && item.name !== (target.avoid || ""))
                .sort(() => 0.5 - Math.random())
                .slice(0, 3)
                .map(i => i.name);
            
            let choices = [...distractors, target.name].sort(() => 0.5 - Math.random());
            currentQuizData = { url: imgUrl, name: target.name, choices: choices, id: selectedId };

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-weight:bold; color:#2E7D32;">${currentRound}단계</p>
                    <img src="${imgUrl}">
                    <p style="margin-top:10px;"><span class="timer-badge">기억하세요</span></p>
                </div>
            `;
            setTimeout(askQuestion, 2500);
        }

        function askQuestion() {
            let choiceButtons = currentQuizData.choices.map(choice => 
                `<button class="choice-btn" onclick="handleAnswer('${choice}')">${choice}</button>`
            ).join('');

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-size:1.65em; font-weight:bold; margin-bottom:15px; color:#1b4d21;">이것의 이름은?</p>
                    <img src="${currentQuizData.url}" style="max-height: 25vh; margin-bottom:10px;">
                    ${choiceButtons}
                    <button class="none-btn" onclick="handleAnswer('없음')">사진이 이상하거나 모름</button>
                </div>
            `;
        }

        function handleAnswer(userAns) {
            let isCorrect = (userAns === currentQuizData.name);
            let isNone = (userAns === '없음');

            // [핵심] '없음'을 눌렀을 때 불량 이미지 점수 가산
            if (isNone) {
                let badImages = JSON.parse(localStorage.getItem('badImages') || "{}");
                badImages[currentQuizData.url] = (badImages[currentQuizData.url] || 0) + 1;
                localStorage.setItem('badImages', JSON.stringify(badImages));
            }

            if (isCorrect) score++;
            history.push({url: currentQuizData.url, ok: isCorrect, name: currentQuizData.name, none: isNone});

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <div class="feedback-mark" style="color: ${isCorrect ? '#2E7D32' : (isNone ? '#78909C' : '#d32f2f')};">
                        ${isCorrect ? '정답!! ⭕' : (isNone ? '사진 제외 중.. ⏩' : '아쉬워요! ❌')}
                    </div>
                    <p style="font-size:1.3em;">정답은 <b>[ ${currentQuizData.name} ]</b></p>
                </div>
            `;
            setTimeout(() => { currentRound++; nextRound(); }, 2000);
        }

        function showResult() {
            let listHtml = history.map((item, idx) => `
                <div style="margin-bottom:30px; border-bottom:1px solid #ddd; padding-bottom:15px; position:relative;">
                    <img src="${item.url}" style="max-height: 15vh;">
                    <div style="position:absolute; top:5px; right:5px; font-size:30px;">${item.ok ? '⭕' : (item.none ? '❓' : '❌')}</div>
                    <p style="margin-top:10px;"><b>${idx+1}. 정답: ${item.name}</b></p>
                </div>
            `).join('');

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <h2 style="color:#2E7D32; font-size:2em;">최종 점수: ${score * 10}점</h2>
                    <p style="font-size:0.9em; color:#666;">'없음'을 두 번 누른 사진은 다시 나오지 않습니다.</p>
                    <hr>${listHtml}
                    <button class="main-btn" onclick="location.reload()">다시 시작하기</button>
                </div>
            `;
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
