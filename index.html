<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기억하기</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #eef5f1; padding: 15px; margin: 0; }
        .game-box { background: white; padding: 20px; border-radius: 15px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { 
            font-size: 22px; padding: 18px; margin: 10px 0; width: 100%; 
            border-radius: 12px; border: none; background: #2E7D32; color: white; cursor: pointer; font-weight: bold;
        }
        img { width: 100%; border-radius: 10px; margin-top: 10px; max-height: 50vh; object-fit: contain; background: #000; }
        .timer-text { font-size: 1.3em; color: #d32f2f; font-weight: bold; }
        .reaction { font-size: 4em; font-weight: bold; margin: 20px 0; }
        .report-item { margin-bottom: 30px; border-bottom: 2px solid #ddd; padding-bottom: 10px; position: relative; }
        .result-mark { position: absolute; top: 10px; right: 10px; font-size: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; width: 60px; height: 60px; line-height: 60px; }
    </style>
</head>
<body>

    <h2 style="color: #2E7D32;">🧠 기억력 훈련</h2>
    <div id="game-area">
        <button onclick="initGame()">오늘의 훈련 시작</button>
    </div>

    <script>
        let currentRound = 1;
        let score = 0;
        let history = [];
        let currentImgUrl = "";
        let currentCorrect = 0;

        // 아버님께 익숙한 한국적 키워드
        const themes = ["korea,mountain", "korea,river", "korea,palace", "korean,food", "korea,village"];

        function initGame() {
            currentRound = 1;
            score = 0;
            history = [];
            nextRound();
        }

        function nextRound() {
            if (currentRound > 10) {
                showResult();
                return;
            }

            // 시간 차등 적용 (10, 8, 6, 5초)
            let sec = 10;
            if (currentRound > 2) sec = 8;
            if (currentRound > 4) sec = 6;
            if (currentRound > 6) sec = 5;

            let theme = themes[Math.floor(Math.random() * themes.length)];
            currentImgUrl = `https://loremflickr.com/640/480/${theme}?lock=${Math.floor(Math.random() * 1000)}`;
            
            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <h3>제 ${currentRound}문</h3>
                    <img src="${currentImgUrl}">
                    <p class="timer-text">${sec}초 동안 기억하세요!</p>
                </div>
            `;

            setTimeout(askQuestion, sec * 1000);
        }

        function askQuestion() {
            // 질문은 단순하게 변별력 있게 고정
            const qText = "이 사진은 '한국'과 관련된 풍경인가요?";
            currentCorrect = 0; // '네'가 정답 (한국 키워드로 가져오므로)

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-size:1.4em; font-weight:bold;">${qText}</p>
                    <button onclick="handleAnswer(0)">네, 맞아요</button>
                    <button onclick="handleAnswer(1)" style="background:#d32f2f;">아니요, 아니에요</button>
                </div>
            `;
        }

        function handleAnswer(ans) {
            let isOk = (ans === currentCorrect);
            if (isOk) score++;
            history.push({url: currentImgUrl, ok: isOk});

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <div class="reaction">${isOk ? '정답!! ⭕' : '땡!! ❌'}</div>
                    <p>${isOk ? '참 잘하셨어요!' : '괜찮아요, 다음 문제!'}</p>
                </div>
            `;

            setTimeout(() => {
                currentRound++;
                nextRound();
            }, 1500);
        }

        function showResult() {
            let listHtml = history.map((item, idx) => `
                <div class="report-item">
                    <img src="${item.url}">
                    <div class="result-mark">${item.ok ? '⭕' : '❌'}</div>
                    <p><strong>${idx + 1}번 사진</strong></p>
                </div>
            `).join('');

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <h2>훈련 종료! 점수: ${score * 10}점</h2>
                    <button onclick="location.reload()">다시 시작하기</button>
                    <hr>
                    ${listHtml}
                </div>
            `;
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
