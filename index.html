<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>기억하기</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #eef5f1; padding: 15px; margin: 0; }
        .game-box { background: white; padding: 20px; border-radius: 15px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { 
            font-size: 22px; padding: 18px; margin: 10px 0; width: 100%; 
            border-radius: 12px; border: none; background: #2E7D32; color: white; cursor: pointer; font-weight: bold;
        }
        button:active { background: #1B5E20; transform: scale(0.98); }
        img { width: 100%; border-radius: 10px; margin-top: 10px; max-height: 50vh; object-fit: contain; background: #000; }
        .timer-text { font-size: 1.3em; color: #d32f2f; font-weight: bold; margin: 10px 0; }
        .reaction { font-size: 3.5em; font-weight: bold; margin: 20px 0; }
        
        .report-item { margin-bottom: 40px; border-bottom: 3px solid #2E7D32; padding-bottom: 20px; position: relative; text-align: center; }
        .report-item img { width: 100%; height: auto; max-height: 300px; object-fit: cover; border-radius: 12px; }
        .result-mark { 
            position: absolute; top: 20px; right: 20px; font-size: 60px; 
            background: rgba(255,255,255,0.9); border-radius: 50%; 
            width: 80px; height: 80px; line-height: 80px; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            text-align: center;
        }
    </style>
</head>
<body>

    <h2 style="color: #2E7D32;">🧠 기억력 훈련</h2>
    <div id="game-area">
        <div class="game-box">
            <p style="font-size: 1.2em;">새로운 사진들로 훈련을 시작할까요?</p>
            <button onclick="initGame()">오늘의 훈련 시작</button>
        </div>
    </div>

    <script>
        let currentRound = 1;
        let score = 0;
        let history = [];
        let currentImgUrl = "";
        let usedSeeds = []; // 사용된 사진 고유 번호를 저장하는 배열

        const themes = ["korea,mountain,nature", "korea,river,scenery", "korea,palace,architecture", "korean,village,countryside", "korea,seoul,landscape"];

        function initGame() {
            currentRound = 1;
            score = 0;
            history = [];
            usedSeeds = []; // 게임 시작 시 초기화
            nextRound();
        }

        function nextRound() {
            if (currentRound > 10) {
                showResult();
                return;
            }

            let sec = 10;
            if (currentRound > 2) sec = 8;
            if (currentRound > 4) sec = 6;
            if (currentRound > 6) sec = 5;

            // 중복되지 않는 고유 번호(seed) 생성
            let seed;
            do {
                seed = Math.floor(Math.random() * 100000);
            } while (usedSeeds.includes(seed)); // 이미 사용된 번호면 다시 뽑기
            
            usedSeeds.push(seed); // 사용된 번호 목록에 추가

            let theme = themes[Math.floor(Math.random() * themes.length)];
            currentImgUrl = `https://loremflickr.com/640/480/${theme}?lock=${seed}`;
            
            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-weight:bold; color:#2E7D32;">문제 ${currentRound} / 10</p>
                    <img src="${currentImgUrl}">
                    <p class="timer-text">${sec}초 동안 잘 기억하세요!</p>
                </div>
            `;

            setTimeout(askQuestion, sec * 1000);
        }

        function askQuestion() {
            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-size:1.5em; font-weight:bold; margin-bottom:25px;">방금 보신 사진은<br>'한국의 풍경'이었나요?</p>
                    <button onclick="handleAnswer(true)">정답!! ⭕ (네)</button>
                    <button onclick="handleAnswer(false)" style="background:#78909C;">땡!! ❌ (아니요)</button>
                </div>
            `;
        }

        function handleAnswer(isYes) {
            let isCorrect = (isYes === true);
            if (isCorrect) score++;
            history.push({url: currentImgUrl, ok: isCorrect});

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <div class="reaction" style="color: ${isCorrect ? '#2E7D32' : '#d32f2f'};">
                        ${isCorrect ? '정답!! ⭕' : '땡!! ❌'}
                    </div>
                    <p style="font-size:1.2em;">${isCorrect ? '훌륭합니다! 다음 사진도 힘내세요!' : '아쉽네요! 다음엔 더 집중해봐요!'}</p>
                </div>
            `;

            setTimeout(() => {
                currentRound++;
                nextRound();
            }, 1500);
        }

        function showResult() {
            let listHtml = history.map((item, idx) => `
                <div class="report-item">
                    <img src="${item.url}">
                    <div class="result-mark">${item.ok ? '⭕' : '❌'}</div>
                    <p style="font-size:1.2em; font-weight:bold; margin-top:10px;">${idx + 1}번째 사진</p>
                </div>
            `).join('');

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <h2 style="color:#2E7D32;">훈련 완료! 점수: ${score * 10}점</h2>
                    <p>오늘 본 사진들을 다시 확인해 보세요.</p>
                    ${listHtml}
                    <button onclick="location.reload()" style="margin-top:20px; background:#1B5E20;">처음 화면으로</button>
                </div>
            `;
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
