<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>아버님 두뇌 활력</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background: #f0f7f4; padding: 15px; margin: 0; }
        .game-box { background: white; padding: 25px; border-radius: 20px; margin-top: 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); border: 2px solid #d1e7dd; }
        .choice-btn { 
            font-size: 20px; padding: 15px; margin: 6px 0; width: 100%; 
            border-radius: 12px; border: 2px solid #2E7D32; background: white; color: #2E7D32; 
            cursor: pointer; font-weight: bold;
        }
        .none-btn { 
            font-size: 20px; padding: 15px; margin: 15px 0 6px 0; width: 100%; 
            border-radius: 12px; border: 2px solid #78909C; background: #f1f3f4; color: #455A64; 
            cursor: pointer; font-weight: bold;
        }
        .main-btn { 
            font-size: 24px; padding: 20px; margin: 12px 0; width: 100%; 
            border-radius: 15px; border: none; background: #2E7D32; color: white; cursor: pointer; font-weight: bold;
        }
        img { width: 100%; border-radius: 15px; margin-top: 10px; max-height: 35vh; object-fit: contain; background: #000; }
        .timer-badge { background: #ffeb3b; padding: 5px 15px; border-radius: 10px; color: #d32f2f; font-weight: bold; font-size: 1.2em; border: 2px solid #fbc02d; }
        .feedback-mark { font-size: 4em; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

    <h2 style="color: #1b4d21;">🧠 겹치지 않는 동·식물 퀴즈</h2>
    <div id="game-area">
        <div class="game-box">
            <p style="font-size: 1.4em; line-height: 1.6;">매번 새로운 사진이 나옵니다.<br>10문제 모두 맞춰보세요!</p>
            <button class="main-btn" onclick="initGame()">훈련 시작하기</button>
        </div>
    </div>

    <script>
        let currentRound = 1;
        let score = 0;
        let history = [];
        let sessionList = []; // 이번 게임에 사용될 10개의 중복 없는 목록

        // 전체 데이터 (동물 + 식물)
        const fullBank = [
            // 식물 (중복 헷갈림 방지 포함)
            { name: "강아지풀", t: "Setaria-viridis", avoid: "강아지" },
            { name: "토끼풀", t: "Trifolium-repens", avoid: "토끼" },
            { name: "닭의장풀", t: "Commelina-communis", avoid: "닭" },
            { name: "애기똥풀", t: "Chelidonium-majus", avoid: "아기" },
            { name: "민들레", t: "dandelion" }, { name: "벚꽃", t: "cherry-blossom" },
            { name: "개나리", t: "forsythia" }, { name: "진달래", t: "azalea" },
            { name: "해바라기", t: "sunflower" }, { name: "코스모스", t: "cosmos-flower" },
            { name: "장미", t: "rose" }, { name: "소나무", t: "pine-tree" },
            { name: "은행나무", t: "ginkgo-tree" }, { name: "단풍나무", t: "maple-tree" },
            { name: "무궁화", t: "hibiscus" }, { name: "나팔꽃", t: "morning-glory" },
            // 동물
            { name: "강아지", t: "dog" }, { name: "토끼", t: "rabbit" }, { name: "닭", t: "chicken" },
            { name: "고양이", t: "cat" }, { name: "사자", t: "lion" }, { name: "호랑이", t: "tiger" },
            { name: "코끼리", t: "elephant" }, { name: "기린", t: "giraffe" }, { name: "하마", t: "hippo" },
            { name: "판다", t: "panda" }, { name: "다람쥐", t: "squirrel" }, { name: "펭귄", t: "penguin" },
            { name: "거북이", t: "turtle" }, { name: "고래", t: "whale" }, { name: "금붕어", t: "goldfish" },
            { name: "나비", t: "butterfly" }, { name: "사슴", t: "deer" }, { name: "코뿔소", t: "rhino" }
        ];

        function initGame() {
            currentRound = 1; 
            score = 0; 
            history = [];
            // 전체 은행에서 무작위로 10개 추출 (중복 없음)
            sessionList = [...fullBank].sort(() => 0.5 - Math.random()).slice(0, 10);
            nextRound();
        }

        function nextRound() {
            if (currentRound > 10) { showResult(); return; }
            
            let target = sessionList[currentRound - 1];
            let seed = Math.floor(Math.random() * 50000);
            let imgUrl = `https://loremflickr.com/800/600/${target.t}?lock=${seed}`;
            
            // 보기 생성 로직 (헷갈리는 이름 차단)
            let distractors = fullBank
                .filter(item => 
                    item.name !== target.name && 
                    item.name !== (target.avoid || "") &&
                    !(target.name === "강아지" && item.name === "강아지풀") &&
                    !(target.name === "토끼" && item.name === "토끼풀") &&
                    !(target.name === "닭" && item.name === "닭의장풀")
                )
                .sort(() => 0.5 - Math.random())
                .slice(0, 3)
                .map(i => i.name);
            
            let choices = [...distractors, target.name].sort(() => 0.5 - Math.random());
            
            currentQuizData = { url: imgUrl, name: target.name, choices: choices };

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-weight:bold; color:#2E7D32;">질문 ${currentRound} / 10</p>
                    <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/800x600?text=사진+로딩+중...'">
                    <p style="margin-top:10px;"><span class="timer-badge">이름이 무엇일까요?</span></p>
                </div>
            `;
            setTimeout(askQuestion, 2000);
        }

        function askQuestion() {
            let choiceButtons = currentQuizData.choices.map(choice => 
                `<button class="choice-btn" onclick="handleAnswer('${choice}')">${choice}</button>`
            ).join('');

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-size:1.6em; font-weight:bold; margin-bottom:15px;">이름을 골라보세요</p>
                    <img src="${currentQuizData.url}" style="max-height: 25vh; margin-bottom:10px;">
                    ${choiceButtons}
                    <button class="none-btn" onclick="handleAnswer('없음')">아는 이름이 없음</button>
                </div>
            `;
        }

        function handleAnswer(userAns) {
            let isCorrect = (userAns === currentQuizData.name);
            if (isCorrect) score++;
            history.push({url: currentQuizData.url, ok: isCorrect, name: currentQuizData.name, none: (userAns === '없음')});

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <div class="feedback-mark" style="color: ${isCorrect ? '#2E7D32' : (userAns === '없음' ? '#78909C' : '#d32f2f')};">
                        ${isCorrect ? '정답!! ⭕' : (userAns === '없음' ? '넘어가기 ⏩' : '아쉬워요! ❌')}
                    </div>
                    <p style="font-size:1.2em;">정답은 <b>${currentQuizData.name}</b></p>
                </div>
            `;
            setTimeout(() => { currentRound++; nextRound(); }, 2000);
        }

        function showResult() {
            let listHtml = history.map((item, idx) => `
                <div style="margin-bottom:30px; border-bottom:1px solid #ddd; padding-bottom:15px; position:relative;">
                    <img src="${item.url}" style="max-height: 15vh;">
                    <div style="position:absolute; top:5px; right:5px; font-size:30px;">${item.ok ? '⭕' : '❌'}</div>
                    <p><b>${idx+1}. 정답: ${item.name}</b></p>
                </div>
            `).join('');

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <h2 style="color:#2E7D32;">최종 점수: ${score * 10}점</h2>
                    <hr>${listHtml}
                    <button class="main-btn" onclick="location.reload()">다시 시작하기</button>
                </div>
            `;
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
