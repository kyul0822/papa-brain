<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>기억하기</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f7f4; padding: 10px; margin: 0; }
        .game-box { background: white; padding: 20px; border-radius: 20px; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #d1e7dd; }
        button { 
            font-size: 24px; padding: 20px; margin: 8px 0; width: 100%; 
            border-radius: 15px; border: none; background: #2E7D32; color: white; cursor: pointer; font-weight: bold;
        }
        button:active { background: #1B5E20; transform: scale(0.98); }
        img { width: 100%; border-radius: 15px; margin-top: 5px; max-height: 40vh; object-fit: contain; background: #000; }
        .timer-badge { background: #ffeb3b; padding: 5px 15px; border-radius: 10px; color: #d32f2f; font-weight: bold; font-size: 1.2em; }
        .feedback-mark { font-size: 4em; font-weight: bold; margin: 10px 0; }
        .report-item { margin-bottom: 40px; border-bottom: 2px solid #2E7D32; padding-bottom: 20px; position: relative; }
        .result-mark { position: absolute; top: 10px; right: 10px; font-size: 60px; background: rgba(255,255,255,0.8); border-radius: 50%; width: 80px; height: 80px; line-height: 80px; }
    </style>
</head>
<body>

    <h2 style="color: #1b4d21; margin: 10px 0;">🧠 기억력 훈련</h2>
    <div id="game-area">
        <div class="game-box">
            <p style="font-size: 1.3em;">아버님, 사진을 기억하고<br>문제를 맞춰보세요!</p>
            <button onclick="initGame()">훈련 시작하기</button>
        </div>
    </div>

    <script>
        let currentRound = 1;
        let score = 0;
        let history = [];
        let currentQuizData = {};

        const quizBank = [
            { theme: "nature,tree", q: "방금 사진에 '초록색 나무'가 있었나요?", a: true },
            { theme: "dog,puppy", q: "사진 속에 귀여운 '강아지'가 있었나요?", a: true },
            { theme: "underwater,fish", q: "사진 속 장소가 '물속(바다)'이었나요?", a: true },
            { theme: "children,kids", q: "사진 속에 '아이들'이 보였나요?", a: true },
            { theme: "cat,kitten", q: "사진 속에 '고양이'가 있었나요?", a: true },
            { theme: "beach,sea", q: "시원한 '바다나 모래사장'이었나요?", a: true }
        ];

        function initGame() {
            currentRound = 1; score = 0; history = [];
            nextRound();
        }

        function nextRound() {
            if (currentRound > 10) { showResult(); return; }
            let sec = (currentRound <= 3) ? 10 : (currentRound <= 7) ? 8 : 6;
            
            let qItem = quizBank[Math.floor(Math.random() * quizBank.length)];
            let seed = Math.floor(Math.random() * 100000);
            let imgUrl = `https://loremflickr.com/600/400/${qItem.theme}?lock=${seed}`;
            
            currentQuizData = { url: imgUrl, q: qItem.q, correct: qItem.a };

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p>문제 ${currentRound} / 10</p>
                    <img src="${imgUrl}">
                    <p style="margin-top:10px;"><span class="timer-badge">${sec}초</span> 동안 잘 보세요!</p>
                </div>
            `;
            setTimeout(askQuestion, sec * 1000);
        }

        function askQuestion() {
            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-size:1.6em; font-weight:bold; margin-bottom:20px;">${currentQuizData.q}</p>
                    <button onclick="handleAnswer(true)">네, 맞아요</button>
                    <button onclick="handleAnswer(false)" style="background:#78909C;">아니요, 없어요</button>
                </div>
            `;
        }

        function handleAnswer(userAns) {
            let isCorrect = (userAns === currentQuizData.correct);
            if (isCorrect) score++;
            history.push({url: currentQuizData.url, ok: isCorrect, q: currentQuizData.q});

            // 즉시 리마인드 화면 (사진 + 질문 + 정답여부)
            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <div class="feedback-mark" style="color: ${isCorrect ? '#2E7D32' : '#d32f2f'};">
                        ${isCorrect ? '정답!! ⭕' : '땡!! ❌'}
                    </div>
                    <img src="${currentQuizData.url}" style="max-height: 25vh; border: 4px solid ${isCorrect ? '#2E7D32' : '#d32f2f'};">
                    <p style="font-size:1.1em; margin-top:10px;">질문: <b>${currentQuizData.q}</b></p>
                    <p style="color:#666;">잠시 후 다음 문제가
