<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>기억하기</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #eef5f1; padding: 15px; margin: 0; }
        .game-box { background: white; padding: 20px; border-radius: 15px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { 
            font-size: 22px; padding: 18px; margin: 10px 0; width: 100%; 
            border-radius: 12px; border: none; background: #2E7D32; color: white; cursor: pointer; font-weight: bold;
        }
        button:active { background: #1B5E20; transform: scale(0.98); }
        img { width: 100%; border-radius: 10px; margin-top: 10px; max-height: 50vh; object-fit: contain; background: #000; }
        .timer-text { font-size: 1.3em; color: #d32f2f; font-weight: bold; margin: 10px 0; }
        .reaction { font-size: 3.5em; font-weight: bold; margin: 20px 0; }
        
        .report-item { margin-bottom: 40px; border-bottom: 3px solid #2E7D32; padding-bottom: 20px; position: relative; text-align: center; }
        .report-item img { width: 100%; height: auto; max-height: 300px; object-fit: cover; border-radius: 12px; }
        .result-mark { 
            position: absolute; top: 20px; right: 20px; font-size: 60px; 
            background: rgba(255,255,255,0.9); border-radius: 50%; 
            width: 80px; height: 80px; line-height: 80px; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            text-align: center;
        }
    </style>
</head>
<body>

    <h2 style="color: #2E7D32;">🧠 기억력 훈련</h2>
    <div id="game-area">
        <div class="game-box">
            <p style="font-size: 1.2em;">매번 다른 질문과 사진으로 시작할까요?</p>
            <button onclick="initGame()">오늘의 훈련 시작</button>
        </div>
    </div>

    <script>
        let currentRound = 1;
        let score = 0;
        let history = [];
        let usedSeeds = [];
        let currentQuizData = {};

        // 질문 데이터 세트 (테마별 질문 다양화)
        const quizBank = [
            { 
                theme: "korea,mountain", 
                questions: [
                    { q: "사진 속에 '계곡물'이나 '강'이 있었나요?", a: true },
                    { q: "산에 '바위'보다 '푸른 나무'가 많았나요?", a: true }
                ]
            },
            { 
                theme: "korea,palace", 
                questions: [
                    { q: "사진에 '기와지붕' 건물이 있었나요?", a: true },
                    { q: "건물 주변에 '사람들'이 많이 있었나요?", a: true }
                ]
            },
            { 
                theme: "korea,river,fishing", 
                questions: [
                    { q: "물가에서 '낚시'하는 사람이 보였나요?", a: true },
                    { q: "물 위에 '배'가 떠 있었나요?", a: true }
                ]
            },
            { 
                theme: "korean,village", 
                questions: [
                    { q: "마을 길가에 '논'이나 '밭'이 있었나요?", a: true },
                    { q: "마을 골목에 '자동차'가 세워져 있었나요?", a: true }
                ]
            },
            { 
                theme: "korea,park,family", 
                questions: [
                    { q: "공원에 '꽃'이나 '잔디'가 많이 보였나요?", a: true },
                    { q: "사진 속에 '어린아이'의 모습이 있었나요?", a: true }
                ]
            }
        ];

        function initGame() {
            currentRound = 1; score = 0; history = []; usedSeeds = [];
            nextRound();
        }

        function nextRound() {
            if (currentRound > 10) { showResult(); return; }

            let sec = (currentRound <= 2) ? 10 : (currentRound <= 4) ? 8 : (currentRound <= 6) ? 6 : 5;

            // 중복 방지 로직
            let seed;
            do { seed = Math.floor(Math.random() * 100000); } while (usedSeeds.includes(seed));
            usedSeeds.push(seed);

            // 랜덤 테마 및 그 테마 안의 랜덤 질문 선택
            let bankItem = quizBank[Math.floor(Math.random() * quizBank.length)];
            let qItem = bankItem.questions[Math.floor(Math.random() * bankItem.questions.length)];
            
            let imgUrl = `https://loremflickr.com/640/480/${bankItem.theme}?lock=${seed}`;
            
            currentQuizData = { url: imgUrl, q: qItem.q, correct: qItem.a };

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-weight:bold; color:#2E7D32;">문제 ${currentRound} / 10</p>
                    <img src="${imgUrl}">
                    <p class="timer-text">${sec}초 동안 잘 기억하세요!</p>
                </div>
            `;

            setTimeout(askQuestion, sec * 1000);
        }

        function askQuestion() {
            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-size:1.5em; font-weight:bold; margin-bottom:25px;">${currentQuizData.q}</p>
                    <button onclick="handleAnswer(true)">네, 맞아요</button>
                    <button onclick="handleAnswer(false)" style="background:#78909C;">아니요, 없어요</button>
                </div>
            `;
        }

        function handleAnswer(userAns) {
            let isCorrect = (userAns === currentQuizData.correct);
            if (isCorrect) score++;
            history.push({url: currentQuizData.url, ok: isCorrect, q: currentQuizData.q});

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <div class="reaction" style="color: ${isCorrect ? '#2E7D32' : '#d32f2f'};">
                        ${isCorrect ? '정답!! ⭕' : '땡!! ❌'}
                    </div>
                    <p style="font-size:1.2em;">${isCorrect ? '참 잘하셨어요!' : '다음 사진을 더 잘 기억해봐요!'}</p>
                </div>
            `;

            setTimeout(() => { currentRound++; nextRound(); }, 1500);
        }

        function showResult() {
            let listHtml = history.map((item, idx) => `
                <div class="report-item">
                    <img src="${item.url}">
                    <div class="result-mark">${item.ok ? '⭕' : '❌'}</div>
                    <p style="font-size:1.1em; font-weight:bold; margin-top:10px;">${idx + 1}번 질문: ${item.q}</p>
                </div>
            `).join('');

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <h2 style="color:#2E7D32;">훈련 완료! ${score * 10}점</h2>
                    <p>아래 사진들과 질문을 다시 확인해 보세요.</p>
                    ${listHtml}
                    <button onclick="location.reload()" style="margin-top:20px; background:#1B5E20;">다시 시작하기</button>
                </div>
            `;
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
