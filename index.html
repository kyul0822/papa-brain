<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기억하기</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2E7D32">
    <style>
        body { font-family: sans-serif; text-align: center; background: #eef5f1; padding: 15px; margin: 0; }
        h2 { color: #2E7D32; margin-top: 20px; letter-spacing: 2px; }
        #status { font-weight: bold; margin-bottom: 10px; color: #1B5E20; font-size: 1.1em; }
        
        .img-container {
            width: 100%; background: #000; border-radius: 12px; overflow: hidden;
            margin-top: 10px; min-height: 250px; display: flex; align-items: center; justify-content: center;
        }
        img { width: 100%; height: auto; max-height: 55vh; display: block; object-fit: contain; }

        .game-box { background: white; padding: 25px; border-radius: 15px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        button { 
            font-size: 22px; padding: 18px; margin: 10px 0; width: 100%; 
            border-radius: 12px; border: none; background: #2E7D32; color: white; 
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: bold;
        }
        button:active { background: #1B5E20; transform: translateY(2px); }
        
        .progress-text { font-size: 1.1em; color: #2E7D32; margin-bottom: 5px; font-weight: bold; }
        .timer-text { font-size: 1.3em; color: #d32f2f; font-weight: bold; margin-top: 10px; }
        .question-text { font-size: 1.5em; font-weight: bold; color: #333; margin-bottom: 25px; line-height: 1.5; }

        .reaction-correct { font-size: 4em; color: #2E7D32; font-weight: bold; margin: 20px 0; }
        .reaction-wrong { font-size: 4em; color: #d32f2f; font-weight: bold; margin: 20px 0; }
        
        /* 결과 리포트 상세 스타일 */
        .report-container { margin-top: 25px; text-align: left; }
        .report-item { 
            background: #fff; border-radius: 12px; padding: 10px; margin-bottom: 15px; 
            border: 2px solid #ddd; position: relative; overflow: hidden;
        }
        .report-item img { 
            width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 8px;
        }
        .result-badge { 
            position: absolute; top: 15px; right: 15px; font-size: 35px; 
            background: rgba(255,255,255,0.9); border-radius: 50%; 
            width: 50px; height: 50px; line-height: 50px; text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .report-q { font-size: 15px; font-weight: bold; color: #555; padding-left: 5px; }
        
        .time-badge { background: #ffeb3b; padding: 2px 10px; border-radius: 8px; color: #000; border: 2px solid #fbc02d; }
    </style>
</head>
<body>

    <div id="status"></div>

        <button onclick="showStats()" style="background:#f1f1f1; color:#333; font-size:16px;">지난 기록 보기</button>
    </div>
