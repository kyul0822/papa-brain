<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>아버님 두뇌 훈련</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f7f4; padding: 15px; margin: 0; }
        .game-box { background: white; padding: 20px; border-radius: 20px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { 
            font-size: 24px; padding: 20px; margin: 10px 0; width: 100%; 
            border-radius: 15px; border: none; background: #2E7D32; color: white; cursor: pointer; font-weight: bold;
        }
        img { width: 100%; border-radius: 15px; margin-top: 10px; max-height: 40vh; object-fit: contain; background: #000; }
        .timer-badge { background: #ffeb3b; padding: 5px 15px; border-radius: 10px; color: #d32f2f; font-weight: bold; font-size: 1.3em; }
        .feedback { font-size: 4em; font-weight: bold; margin: 15px 0; }
        .remind-box { background: #f9f9f9; padding: 15px; border-radius: 10px; border: 1px solid #ddd; margin-top: 10px; }
    </style>
</head>
<body>

    <h2 style="color: #1b4d21;">🧠 기억력 훈련</h2>
    <div id="game-area">
        <div class="game-box">
            <p style="font-size: 1.3em;">아버님, 사진을 기억하고<br>문제를 맞히는 훈련입니다!</p>
            <button onclick="startTraining()">훈련 시작하기</button>
        </div>
    </div>

    <script>
        let round = 1;
        let score = 0;
        let logs = [];
        let currentImg = "";
        let currentQ = "";
        let currentA = true;

        const questions = [
            { t: "nature,forest", q: "방금 본 사진에 '초록색 나무'가 있었나요?" },
            { t: "dog,puppy", q: "사진 속에 귀여운 '강아지'가 있었나요?" },
            { t: "fish,sea", q: "사진 속 장소가 '물속이나 바다'였나요?" },
            { t: "children,kids", q: "사진 속에 '아이들'이 보였나요?" },
            { t: "cat,kitten", q: "사진 속에 '고양이'가 있었나요?" },
            { t: "beach,ocean", q: "시원한 '바다나 모래사장' 사진이었나요?" }
        ];

        function startTraining() {
            round = 1; score = 0; logs = [];
            loadNext();
        }

        function loadNext() {
            if (round > 10) {
                showFinal();
                return;
            }

            let sec = (round <= 3) ? 10 : (round <= 7) ? 8 : 6;
            let item = questions[Math.floor(Math.random() * questions.length)];
            let seed = Math.floor(Math.random() * 9999);
            currentImg = `https://loremflickr.com/600/400/${item.t}?lock=${seed}`;
            currentQ = item.q;

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-weight:bold;">${round} / 10 번째</p>
                    <img src="${currentImg}">
                    <p><span class="timer-badge">${sec}초</span> 동안 잘 보세요!</p>
                </div>
            `;

            setTimeout(ask, sec * 1000);
        }

        function ask() {
            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-size:1.6em; font-weight:bold;">${currentQ}</p>
                    <button onclick="check(true)">네, 맞아요</button>
                    <button onclick="check(false)" style="background:#78909C;">아니요, 없어요</button>
                </div>
            `;
        }

        function check(userAns) {
            let isOk = (userAns === true); // 질문들이 모두 '있는 것'을 묻도록 설계됨
            if (isOk) score++;
            logs.push({img: currentImg, q: currentQ, ok: isOk});

            // 즉시 리마인드 화면
            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <div class="feedback" style="color: ${isOk ? '#2E7D32' : '#d32f2f'};">
                        ${isOk ? '정답!! ⭕' : '땡!! ❌'}
                    </div>
                    <img src="${currentImg}" style="max-height: 20vh; border: 4px solid ${isOk ? '#2E7D32' : '#d32f2f'};">
                    <div class="remind-box">
                        질문: <b>${currentQ}</b><br>
                        <small>사진을 다시 한 번 확인해 보세요.</small>
                    </div>
                </div>
            `;

            setTimeout(() => {
                round++;
                loadNext();
            }, 3000); // 3초 리마인드 후 다음 문제
        }

        function showFinal() {
            let resHtml = logs.map((l, i) => `
                <div style="margin-bottom:30px; border-bottom:2px solid #eee; padding-bottom:10px; position:relative;">
                    <img src="${l.img}">
                    <div style="position:absolute; top:10px; right:10px; font-size:50px;">${l.ok ? '⭕' : '❌'}</div>
                    <p><b>${i+1}번:</b> ${l.q}</p>
                </div>
            `).join('');

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <h2 style="color:#2E7D32;">최종 점수: ${score * 10}점</h2>
                    <button onclick="location.reload()">처음으로</button>
                    <hr>
                    ${resHtml}
                </div>
            `;
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
