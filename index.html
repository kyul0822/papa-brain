<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기억하기</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2E7D32">
    <style>
        body { font-family: sans-serif; text-align: center; background: #eef5f1; padding: 15px; margin: 0; }
        h2 { color: #2E7D32; margin-top: 20px; letter-spacing: 2px; }
        #status { font-weight: bold; margin-bottom: 10px; color: #1B5E20; font-size: 1.1em; }
        
        .img-container {
            width: 100%; background: #000; border-radius: 12px; overflow: hidden;
            margin-top: 10px; min-height: 250px; display: flex; align-items: center; justify-content: center;
        }
        img { width: 100%; height: auto; max-height: 55vh; display: block; object-fit: contain; }

        .game-box { background: white; padding: 25px; border-radius: 15px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        button { 
            font-size: 22px; padding: 18px; margin: 10px 0; width: 100%; 
            border-radius: 12px; border: none; background: #2E7D32; color: white; 
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-weight: bold;
        }
        button:active { background: #1B5E20; transform: translateY(2px); }
        
        .progress-text { font-size: 1.1em; color: #2E7D32; margin-bottom: 5px; font-weight: bold; }
        .timer-text { font-size: 1.3em; color: #d32f2f; font-weight: bold; margin-top: 10px; }
        .question-text { font-size: 1.5em; font-weight: bold; color: #333; margin-bottom: 25px; line-height: 1.5; }

        /* 리액션 스타일 */
        .reaction-correct { font-size: 3.5em; color: #2E7D32; font-weight: bold; margin: 10px 0; }
        .reaction-wrong { font-size: 3.5em; color: #d32f2f; font-weight: bold; margin: 10px 0; }
        .reaction-text { font-size: 1.3em; color: #333; margin-bottom: 20px; font-weight: bold; }
        
        .time-badge { background: #ffeb3b; padding: 2px 10px; border-radius: 8px; color: #000; border: 2px solid #fbc02d; }
    </style>
</head>
<body>

    <h2>🧠 기억하기</h2>
    <div id="status"></div>

    <div id="game">
        <button onclick="startSession()">오늘의 훈련 시작 (10문제)</button>
        <button onclick="showStats()" style="background:#f1f1f1; color:#333; font-size:16px;">지난 기록 보기</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }

        let level = parseInt(localStorage.getItem("level")) || 1;
        let day = parseInt(localStorage.getItem("day")) || 1;
        let currentRound = 0;
        let sessionSuccess = 0;
        let currentType = {};

        const questionBank = [
            { kw: "korea,mountain", q: "사진 속 산에 '물(계곡/강)'이 보였나요?", a: ["네, 있어요", "아니요, 없어요", "기억이 안 나요"], correctIdx: 0 },
            { kw: "korea,river", q: "사진 속 물가 주변에 '나무'가 있었나요?", a: ["예, 있어요", "아니요, 없어요", "기억이 안 나요"], correctIdx: 0 },
            { kw: "korean,children,play", q: "사진 속 아이들이 무엇을 하고 있었나요?", a: ["놀고 있어요", "공부해요", "잠자고 있어요"], correctIdx: 0 },
            { kw: "korean,people", q: "사진 속에 사람이 여러 명 있었나요?", a: ["네, 많아요", "아니요, 혼자에요", "기억이 안 나요"], correctIdx: 0 },
            { kw: "korea,sea", q: "사진 속 장소는 '바다'가 맞나요?", a: ["네, 바다에요", "아니요, 산이에요", "기억이 안 나요"], correctIdx: 0 },
            { kw: "korean,food", q: "사진에 맛있는 '음식'이 있었나요?", a: ["네, 있어요", "아니요, 없어요", "기억이 안 나요"], correctIdx: 0 },
            { kw: "korea,village", q: "사진 속에 '집'이나 '건물'이 보였나요?", a: ["네, 보여요", "아니요, 없어요", "기억이 안 나요"], correctIdx: 0 }
        ];

        updateStatus();

        function updateStatus() {
            document.getElementById("status").innerHTML = "오늘 " + day + "일차 | 단계: " + level;
        }

        function startSession() {
            currentRound = 1;
            sessionSuccess = 0;
            loadQuestion();
        }

        // 라운드별 시간 설정 (요청하신 대로 적용)
        function getTimerValue(round) {
            if (round <= 2) return 10;
            if (round <= 4) return 8;
            if (round <= 6) return 6;
            return 5;
        }

        function loadQuestion() {
            currentType = questionBank[Math.floor(Math.random() * questionBank.length)];
            let imgUrl = `https://loremflickr.com/600/400/${currentType.kw}?t=${new Date().getTime() + currentRound}`;
            let waitTime = getTimerValue(currentRound); 
            
            document.getElementById("game").innerHTML = `
                <div class="progress-text">${currentRound} / 10</div>
                <div class="img-container">
                    <img src="${imgUrl}">
                </div>
                <p class="timer-text"><span class="time-badge">${waitTime}초</span> 동안 잘 보세요!</p>
            `;
            
            setTimeout(() => askQuestion(), waitTime * 1000);
        }

        function askQuestion() {
            let optionsHtml = currentType.a.map((ans, idx) => {
                let color = idx === 2 ? "background:#78909C" : "";
                return `<button style="${color}" onclick="showReaction(${idx})">${ans}</button>`;
            }).join('');

            document.getElementById("game").innerHTML = `
                <div class="game-box">
                    <div class="progress-text">${currentRound} / 10 번째 질문</div>
                    <div class="question-text">${currentType.q}</div>
                    ${optionsHtml}
                </div>
            `;
        }

        // ★ 정답/오답 리액션 화면 처리 ★
        function showReaction(userChoice) {
            let isCorrect = (userChoice === currentType.correctIdx);
            let reactionHtml = "";

            if (isCorrect) {
                sessionSuccess++;
                reactionHtml = `
                    <div class="game-box">
                        <div class="reaction-correct">정답!! ⭕</div>
                        <div class="reaction-text">아버님, 정말 대단하세요!</div>
                        <button onclick="nextStep()">다음 문제로 고고!</button>
                    </div>
                `;
            } else {
                reactionHtml = `
                    <div class="game-box">
                        <div class="reaction-wrong">땡!! ❌</div>
                        <div class="reaction-text">아쉽네요. 다음 사진은 더 잘 보실 거죠?</div>
                        <button onclick="nextStep()" style="background:#78909C">다음 문제로 넘어가기</button>
                    </div>
                `;
            }
            document.getElementById("game").innerHTML = reactionHtml;
        }

        function nextStep() {
            if (currentRound < 10) {
                currentRound++;
                loadQuestion();
            } else {
                finishSession();
            }
        }

        function finishSession() {
            let rec = JSON.parse(localStorage.getItem("rec") || "[]");
            rec.push({ d: new Date().toLocaleDateString(), score: sessionSuccess });
            localStorage.setItem("rec", JSON.stringify(rec));

            if (sessionSuccess >= 8 && level < 4) level++;
            if (sessionSuccess < 5 && level > 1) level--;
            
            day++; 
            localStorage.setItem("level", level);
            localStorage.setItem("day", day);

            document.getElementById("game").innerHTML = `
                <div class="game-box">
                    <h3>오늘의 훈련 완료!</h3>
                    <div style="font-size:1.8em; margin:20px 0; color:#2E7D32;">참 잘하셨습니다!</div>
                    <p style="font-size:1.3em;">오늘의 기억 점수: <strong>${sessionSuccess * 10}점</strong></p>
                    <button onclick="location.reload()">처음 화면으로</button>
                </div>
            `;
            updateStatus();
        }

        function showStats() {
            let rec = JSON.parse(localStorage.getItem("rec") || "[]");
            document.getElementById("game").innerHTML = `
                <div class="game-box" style="text-align:left;">
                    <h4 style="text-align:center;">누적 기록</h4>
                    <p>📅 총 훈련 횟수: ${rec.length}회</p>
                    <p>💡 마지막 점수: ${rec.length > 0 ? (rec[rec.length-1].score * 10) : 0}점</p>
                    <button onclick="location.reload()">뒤로 가기</button>
                </div>
            `;
        }
    </script>
</body>
</html>
