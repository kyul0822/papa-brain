<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>아버님 두뇌 활력</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background: #f0f7f4; padding: 15px; margin: 0; }
        .game-box { background: white; padding: 25px; border-radius: 20px; margin-top: 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); border: 2px solid #d1e7dd; }
        .choice-btn { 
            font-size: 20px; padding: 15px; margin: 6px 0; width: 100%; 
            border-radius: 12px; border: 2px solid #2E7D32; background: white; color: #2E7D32; 
            cursor: pointer; font-weight: bold;
        }
        .none-btn { 
            font-size: 20px; padding: 15px; margin: 15px 0 6px 0; width: 100%; 
            border-radius: 12px; border: 2px solid #78909C; background: #f1f3f4; color: #455A64; 
            cursor: pointer; font-weight: bold;
        }
        .main-btn { 
            font-size: 24px; padding: 20px; margin: 12px 0; width: 100%; 
            border-radius: 15px; border: none; background: #2E7D32; color: white; cursor: pointer; font-weight: bold;
        }
        img { width: 100%; border-radius: 15px; margin-top: 10px; max-height: 35vh; object-fit: contain; background: #000; }
        .timer-badge { background: #ffeb3b; padding: 5px 15px; border-radius: 10px; color: #d32f2f; font-weight: bold; font-size: 1.2em; border: 2px solid #fbc02d; }
        .feedback-mark { font-size: 4em; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

    <h2 style="color: #1b4d21;">🧠 헷갈림 방지 두뇌 훈련</h2>
    <div id="game-area">
        <div class="game-box">
            <p style="font-size: 1.4em; line-height: 1.6;">비슷한 이름에 속지 않도록<br>눈을 크게 뜨고 맞춰보세요!</p>
            <button class="main-btn" onclick="initGame()">훈련 시작하기</button>
        </div>
    </div>

    <script>
        let currentRound = 1;
        let score = 0;
        let history = [];
        
        // 동물을 포함한 식물 이름들을 특별 관리 대상으로 지정
        const plantBank = [
            { name: "강아지풀", t: "Setaria-viridis", avoid: "강아지" },
            { name: "토끼풀", t: "Trifolium-repens", avoid: "토끼" },
            { name: "닭의장풀", t: "Commelina-communis", avoid: "닭" },
            { name: "애기똥풀", t: "Chelidonium-majus", avoid: "아기" },
            { name: "벚나무", t: "cherry-blossom" }, { name: "개나리", t: "forsythia" },
            { name: "진달래", t: "azalea" }, { name: "민들레", t: "dandelion" },
            { name: "소나무", t: "pine-tree" }, { name: "해바라기", t: "sunflower" }
        ];

        const animalBank = [
            { name: "강아지", t: "dog" }, { name: "토끼", t: "rabbit" }, { name: "닭", t: "chicken" },
            { name: "사자", t: "lion" }, { name: "호랑이", t: "tiger" }, { name: "코끼리", t: "elephant" },
            { name: "고양이", t: "cat" }, { name: "다람쥐", t: "squirrel" }, { name: "판다", t: "panda" }
        ];

        function initGame() {
            currentRound = 1; score = 0; history = [];
            nextRound();
        }

        function nextRound() {
            if (currentRound > 10) { showResult(); return; }
            
            // 동물과 식물 중 랜덤 선택
            let isPlant = Math.random() > 0.5;
            let targetBank = isPlant ? plantBank : animalBank;
            let otherBank = isPlant ? animalBank : plantBank;
            
            let target = targetBank[Math.floor(Math.random() * targetBank.length)];
            let seed = Math.floor(Math.random() * 30000);
            let imgUrl = `https://loremflickr.com/800/600/${target.t}?lock=${seed}`;
            
            // 보기 생성 로직 (헷갈리는 이름 차단)
            let distractors = [];
            
            // 1. 같은 카테고리에서 오답 2개 추출 (헷갈리는 단어 제외)
            let filteredTargetBank = targetBank.filter(item => 
                item.name !== target.name && 
                item.name !== (target.avoid || "") &&
                !(item.avoid && item.avoid === target.name)
            );
            
            // 2. 다른 카테고리에서 오답 1개 추출 (헷갈리는 단어 제외)
            let filteredOtherBank = otherBank.filter(item => 
                item.name !== target.name && 
                item.name !== (target.avoid || "")
            );

            distractors.push(...filteredTargetBank.sort(() => 0.5 - Math.random()).slice(0, 2).map(i => i.name));
            distractors.push(...filteredOtherBank.sort(() => 0.5 - Math.random()).slice(0, 1).map(i => i.name));
            
            let choices = [...distractors, target.name].sort(() => 0.5 - Math.random());
            
            currentQuizData = { url: imgUrl, name: target.name, choices: choices };

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-weight:bold; color:#2E7D32;">${currentRound} / 10</p>
                    <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/800x600?text=사진+준비+중...'">
                    <p style="margin-top:10px;"><span class="timer-badge">정답은 무엇일까요?</span></p>
                </div>
            `;
            setTimeout(askQuestion, 2000);
        }

        function askQuestion() {
            let choiceButtons = currentQuizData.choices.map(choice => 
                `<button class="choice-btn" onclick="handleAnswer('${choice}')">${choice}</button>`
            ).join('');

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-size:1.6em; font-weight:bold; margin-bottom:15px;">이름을 골라보세요</p>
                    <img src="${currentQuizData.url}" style="max-height: 25vh; margin-bottom:10px;">
                    ${choiceButtons}
                    <button class="none-btn" onclick="handleAnswer('없음')">아는 이름이 없음</button>
                </div>
            `;
        }

        function handleAnswer(userAns) {
            let isCorrect = (userAns === currentQuizData.name);
            if (isCorrect) score++;
            history.push({url: currentQuizData.url, ok: isCorrect, name: currentQuizData.name, none: (userAns === '없음')});

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <div class="feedback-mark" style="color: ${isCorrect ? '#2E7D32' : '#d32f2f'};">
                        ${isCorrect ? '정답!! ⭕' : (userAns === '없음' ? '확인 ⏩' : '아쉬워요! ❌')}
                    </div>
                    <p>정답: <b>${currentQuizData.name}</b></p>
                </div>
            `;
            setTimeout(() => { currentRound++; nextRound(); }, 2000);
        }

        function showResult() {
            let listHtml = history.map((item, idx) => `
                <div style="margin-bottom:30px; border-bottom:1px solid #ddd; padding-bottom:15px;">
                    <img src="${item.url}" style="max-height: 15vh;">
                    <p><b>${idx+1}. 정답: ${item.name}</b> (${item.ok ? '⭕' : '❌'})</p>
                </div>
            `).join('');

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <h2 style="color:#2E7D32;">최종 점수: ${score * 10}점</h2>
                    <hr>${listHtml}
                    <button class="main-btn" onclick="location.reload()">다시 하기</button>
                </div>
            `;
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
