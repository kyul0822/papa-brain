<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>아버님 두뇌 활력</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background: #f0f7f4; padding: 15px; margin: 0; }
        .game-box { background: white; padding: 25px; border-radius: 20px; margin-top: 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); border: 2px solid #d1e7dd; }
        .choice-btn { 
            font-size: 20px; padding: 15px; margin: 6px 0; width: 100%; 
            border-radius: 12px; border: 2px solid #2E7D32; background: white; color: #2E7D32; 
            cursor: pointer; font-weight: bold;
        }
        .choice-btn:active { background: #E8F5E9; transform: scale(0.98); }
        .main-btn { 
            font-size: 24px; padding: 20px; margin: 12px 0; width: 100%; 
            border-radius: 15px; border: none; background: #2E7D32; color: white; cursor: pointer; font-weight: bold;
        }
        img { width: 100%; border-radius: 15px; margin-top: 10px; max-height: 35vh; object-fit: contain; background: #000; }
        .timer-badge { background: #ffeb3b; padding: 5px 15px; border-radius: 10px; color: #d32f2f; font-weight: bold; font-size: 1.2em; border: 2px solid #fbc02d; }
        .feedback-mark { font-size: 4em; font-weight: bold; margin: 10px 0; }
        .remind-text { font-size: 1.2em; color: #333; background: #f9f9f9; padding: 15px; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2 style="color: #1b4d21;">🧠 우리 곁의 동·식물 이름 맞히기</h2>
    <div id="game-area">
        <div class="game-box">
            <p style="font-size: 1.4em; line-height: 1.6;">사진을 보고 이름을 맞춰보세요!<br>총 10문제가 나옵니다.</p>
            <button class="main-btn" onclick="initGame()">훈련 시작하기</button>
        </div>
    </div>

    <script>
        let currentRound = 1;
        let score = 0;
        let history = [];
        
        // 요청하신 모든 동식물 데이터 (주제 키워드 최적화)
        const dataBank = [
            // 동물 (Animal)
            { name: "사자", t: "lion" }, { name: "호랑이", t: "tiger" }, { name: "표범", t: "leopard" }, { name: "치타", t: "cheetah" },
            { name: "곰", t: "bear" }, { name: "늑대", t: "wolf" }, { name: "여우", t: "fox" }, { name: "하이에나", t: "hyena" },
            { name: "코끼리", t: "elephant" }, { name: "기린", t: "giraffe" }, { name: "하마", t: "hippo" }, { name: "코뿔소", t: "rhino" },
            { name: "얼룩말", t: "zebra" }, { name: "사슴", t: "deer" }, { name: "토끼", t: "rabbit" }, { name: "다람쥐", t: "squirrel" },
            { name: "판다", t: "panda" }, { name: "캥거루", t: "kangaroo" }, { name: "말", t: "horse" }, { name: "소", t: "cow" },
            { name: "독수리", t: "eagle" }, { name: "펭귄", t: "penguin" }, { name: "개구리", t: "frog" }, { name: "거북이", t: "turtle" },
            { name: "고래", t: "whale" }, { name: "상어", t: "shark" }, { name: "문어", t: "octopus" }, { name: "나비", t: "butterfly" },
            // 식물 (Plant)
            { name: "민들레", t: "dandelion" }, { name: "강아지풀", t: "foxtail-grass" }, { name: "벚나무", t: "cherry-blossom" },
            { name: "개나리", t: "forsythia" }, { name: "진달래", t: "azalea" }, { name: "소나무", t: "pine-tree" },
            { name: "은행나무", t: "ginkgo-tree" }, { name: "무궁화", t: "hibiscus" }, { name: "해바라기", t: "sunflower" },
            { name: "코스모스", t: "cosmos-flower" }, { name: "장미", t: "rose" }, { name: "수국", t: "hydrangea" },
            { name: "나팔꽃", t: "morning-glory" }, { name: "목련", t: "magnolia" }, { name: "국화", t: "chrysanthemum" }
            // ... (데이터는 여기에 계속 추가 가능)
        ];

        function initGame() {
            currentRound = 1; score = 0; history = [];
            nextRound();
        }

        function nextRound() {
            if (currentRound > 10) { showResult(); return; }
            
            let target = dataBank[Math.floor(Math.random() * dataBank.length)];
            let seed = Math.floor(Math.random() * 10000);
            let imgUrl = `https://loremflickr.com/800/600/${target.t}?lock=${seed}`;
            
            // 보기 4개 생성
            let distractors = dataBank
                .filter(a => a.name !== target.name)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3)
                .map(a => a.name);
            let choices = [...distractors, target.name].sort(() => 0.5 - Math.random());
            
            currentQuizData = { url: imgUrl, name: target.name, choices: choices };

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-weight:bold; color:#2E7D32;">${currentRound} / 10 문제</p>
                    <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/800x600?text=사진+로딩중...'">
                    <p style="margin-top:10px;"><span class="timer-badge">잘 살펴보세요</span></p>
                </div>
            `;
            
            setTimeout(askQuestion, 3000);
        }

        function askQuestion() {
            let choiceButtons = currentQuizData.choices.map(choice => 
                `<button class="choice-btn" onclick="handleAnswer('${choice}')">${choice}</button>`
            ).join('');

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <p style="font-size:1.6em; font-weight:bold; margin-bottom:15px;">이것의 이름은 무엇인가요?</p>
                    <img src="${currentQuizData.url}" style="max-height: 25vh; margin-bottom:15px;">
                    ${choiceButtons}
                </div>
            `;
        }

        function handleAnswer(userAns) {
            let isCorrect = (userAns === currentQuizData.name);
            if (isCorrect) score++;
            history.push({url: currentQuizData.url, ok: isCorrect, name: currentQuizData.name});

            document.getElementById('game-area').innerHTML = `
                <div class="game-box">
                    <div class="feedback-mark" style="color: ${isCorrect ? '#2E7D32' : '#d32f2f'};">
                        ${isCorrect ? '정답!! ⭕' : '아쉬워요! ❌'}
                    </div>
                    <div class="remind-text">
                        이름: <b>${currentQuizData.name}</b><br>
